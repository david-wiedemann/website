<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
<title id="title">Evolution of a periodic porous microstructure</title>
<desc id="desc">Two panels show six periodic solid inclusions in a connected fluid region. At time t=0 the inclusions are smaller. At time t=T/2 they are larger, narrowing the flow channels. An arrow indicates fluid flow.</desc>
<defs>
  <pattern id="cells" width="108" height="105" patternUnits="userSpaceOnUse">
    <path d="M108 0H0V105" fill="none" stroke="#c7dce9" stroke-width="1" stroke-dasharray="4 5"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10Z" fill="#256b99" />
  </marker>
</defs>
<rect x="1" y="1" width="958" height="318" rx="16" fill="#ffffff" stroke="#e2eaf1"/>
<text x="240" y="40" text-anchor="middle" fill="#173f6b" font-family="Arial,sans-serif" font-size="18" font-weight="700">t = 0</text>
<text x="720" y="40" text-anchor="middle" fill="#173f6b" font-family="Arial,sans-serif" font-size="18" font-weight="700">t = T/2</text>
<rect x="28" y="58" width="424" height="204" rx="12" fill="#e5f3fa" stroke="#84b3d0" stroke-width="1.5"/>
<rect x="508" y="58" width="424" height="204" rx="12" fill="#e5f3fa" stroke="#84b3d0" stroke-width="1.5"/>
<rect x="28" y="58" width="424" height="204" rx="12" fill="url(#cells)" opacity="0.8"/>
<rect x="508" y="58" width="424" height="204" rx="12" fill="url(#cells)" opacity="0.8"/>
<g fill="#365979" stroke="#244561" stroke-width="1.5">
  <circle cx="108" cy="112" r="22"/><circle cx="240" cy="112" r="22"/><circle cx="372" cy="112" r="22"/>
  <circle cx="108" cy="208" r="22"/><circle cx="240" cy="208" r="22"/><circle cx="372" cy="208" r="22"/>
  <circle cx="588" cy="112" r="35"/><circle cx="720" cy="112" r="35"/><circle cx="852" cy="112" r="35"/>
  <circle cx="588" cy="208" r="35"/><circle cx="720" cy="208" r="35"/><circle cx="852" cy="208" r="35"/>
</g>
<path d="M42 160 H438" fill="none" stroke="#256b99" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M522 160 H918" fill="none" stroke="#256b99" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="166" text-anchor="middle" fill="#637888" font-family="Arial,sans-serif" font-size="26">→</text>
<circle cx="300" cy="294" r="8" fill="#365979"/>
<text x="319" y="299" fill="#26313d" font-family="Arial,sans-serif" font-size="15">solid inclusions</text>
<rect x="500" y="286" width="17" height="15" rx="3" fill="#e5f3fa" stroke="#84b3d0"/>
<text x="528" y="299" fill="#26313d" font-family="Arial,sans-serif" font-size="15">fluid region</text>
</svg>
