    <dc:title>Effective medium and reference cell</dc:title>
    <dc:date>2026-10-10T14:42:43.097895</dc:date>
    <dc:description>A uniform effective medium Omega has an asymmetric outline with rounded corners. The reference cell Y is immediately to its right at the same vertical level. The ellipse lies at the exact centre of Y. The fill color of Omega is the phase-area-weighted mean of the reference cell colors. There is no epsilon-to-zero arrow.</dc:description>
