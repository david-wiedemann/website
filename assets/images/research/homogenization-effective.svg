<svg xmlns="http://www.w3.org/2000/svg" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:ns2="http://creativecommons.org/ns#" xmlns:ns4="http://www.w3.org/1999/xlink" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" width="720pt" height="385.2pt" viewBox="0 0 720 385.2" version="1.1" role="img" aria-labelledby="figure-title figure-description">
 <title id="figure-title">Effective medium and reference cell</title><desc id="figure-description">A uniform effective medium Omega has an asymmetric outline with rounded corners. The reference cell Y is immediately to its right at the same vertical level. The ellipse lies at the exact centre of Y. The fill color of Omega is the phase-area-weighted mean of the reference cell colors. There is no epsilon-to-zero arrow.</desc><title>Effective medium and reference cell</title>
 <metadata>
  <rdf:RDF>
